name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://quantive:quantive@localhost:5432/quantive
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Postgres + Redis via apt (no Docker dependency — hosted runners have
      # flaky Docker daemons; apt services are always available).
      - name: Start Postgres + Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-contrib redis-server
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE USER quantive PASSWORD 'quantive'"
          sudo -u postgres psql -c "CREATE DATABASE quantive OWNER quantive"
          sudo service redis-server start || redis-server --daemonize yes
          pg_isready -h localhost -p 5432 -U quantive
          redis-cli ping

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npx tsx prisma/seed.ts
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
