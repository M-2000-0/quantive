name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check quantive/ tests/ --output-format=github || true
      - name: Type check
        run: python -m mypy quantive/ --ignore-missing-imports --no-error-summary || true
      - name: Test
        run: python -m pytest tests/ -v --tb=short

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint
        run: |
          cd backend
          python -m ruff check app/ tests/ --output-format=github || true
      - name: Type check
        run: |
          cd backend
          python -m mypy app/ --ignore-missing-imports --no-error-summary || true
      - name: Test
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint || true
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit || true
      - name: Build
        run: |
          cd frontend
          npm run build
