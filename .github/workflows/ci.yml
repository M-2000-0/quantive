name: Quantive CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          cd backend
          python -m py_compile app/main.py
          python -m py_compile app/database.py
          python -m py_compile app/schemas/__init__.py
          python -m py_compile app/security/csrf.py
          python -m py_compile app/security/rbac_middleware.py
          python -m py_compile app/security/rate_limiter.py

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Security audit
        run: |
          cd frontend
          npm audit --audit-level=high
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Unit tests
        run: |
          cd frontend
          npx vitest run --reporter=verbose

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short -x

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit
      - name: Dependency audit
        run: |
          cd backend
          pip-audit
      - name: Basic security scan
        run: |
          cd backend
          bandit -r app/ -ll --skip B101,B311

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and verify
        run: |
          cd backend
          pip install -r requirements.txt
          python -c "import app.main; print('Import OK')"
      - name: Verify all API routes
        run: |
          cd backend
          python -c "
          from app.main import app
          routes = [r.path for r in app.routes]
          print(f'Total routes: {len(routes)}')
          assert len(routes) > 50, 'Too few routes'
          print('Route check OK')
          "
