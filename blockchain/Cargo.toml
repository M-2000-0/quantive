[workspace]
members = [
    "crates/types",
    "crates/consensus",
    "crates/execution",
    "crates/crosschain",
    "crates/networking",
    "crates/storage",
    "crates/node",
    "crates/omnichain-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha3 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
revm = { version = "19", features = ["serde"] }
alloy-primitives = "0.8"
alloy-rlp = "0.3"
ed25519-dalek = "2"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
parking_lot = "0.12"
dashmap = "6"
sled = "0.34"
libp2p = { version = "0.54", features = ["tokio", "kad", "gossipsub", "identify", "ping", "noise", "yamux", "macros", "dns", "tcp", "quic"] }
tower = { version = "0.5", features = ["util"] }
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }
