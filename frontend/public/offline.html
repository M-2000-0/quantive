<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantive — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e0e7ff 0%,#f0f4ff 50%,#e8f4f8 100%);font-family:Inter,system-ui,sans-serif}
    .card{background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.6);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.08);padding:32px;max-width:480px;text-align:center}
    h1{font-size:20px;margin:0 0 8px;color:#0f172a}
    p{color:#475569;margin:0 0 16px;line-height:1.5}
    a{display:inline-flex;padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#1e40af,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;margin:0 auto 16px">Q</div>
    <h1>You’re offline</h1>
    <p>Quantive is installed and will continue to work with cached data. Reconnect to sync portfolios and optimizations.</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
