version: "3.9"

services:
  website:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
      - ./api.js:/usr/share/nginx/html/api.js
    depends_on:
      - api
    networks:
      - quantive

networks:
  quantive:
    external: false
