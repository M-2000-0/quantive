<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantive Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="quantive-logo.png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Inter',system-ui,sans-serif;background:#0A0A0B;color:#F5F5F3;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── Top bar ─────────────────────────────────────────────────────── */
.topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(10,10,11,0.85);backdrop-filter:blur(12px);flex-shrink:0}
.topbar .logo{display:flex;align-items:center;gap:8px}
.topbar .logo img{width:28px;height:28px;border-radius:6px}
.topbar .logo span{font-size:15px;font-weight:700;letter-spacing:-0.02em}
.topbar .logo em{font-style:italic;color:#8A8A90;font-weight:400;font-size:13px;margin-left:4px}
.topbar .spacer{flex:1}
.topbar a{font-size:12px;color:#8A8A90;text-decoration:none;font-weight:500}
.topbar a:hover{color:#F5F5F3}

/* ── Messages area ───────────────────────────────────────────────── */
.messages{flex:1;overflow-y:auto;padding:24px 0;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.msg-row{display:flex;justify-content:center;padding:6px 20px}
.msg-row.user{justify-content:flex-end}
.msg-row.assistant{justify-content:flex-start}
.msg{max-width:680px;width:100%;padding:14px 18px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--accent,#4D8DFF);color:#0A0A0B;border-bottom-right-radius:4px;font-weight:500}
.msg.assistant{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:4px;color:#E5E5E3}
.msg strong{color:#fff;font-weight:650}
.msg.user strong{color:#0A0A0B}

/* ── Typing indicator ────────────────────────────────────────────── */
.typing{display:none;padding:6px 20px}
.typing.show{display:flex}
.typing-dot{width:7px;height:7px;border-radius:50%;background:#8A8A90;margin:0 3px;animation:bounce .6s infinite alternate}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.3;transform:translateY(-3px)}}

/* ── Welcome screen ──────────────────────────────────────────────── */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center}
.welcome h1{font-size:28px;font-weight:700;letter-spacing:-0.03em}
.welcome p{color:#8A8A90;font-size:14px;max-width:420px;line-height:1.6}
.welcome .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.chip{padding:8px 14px;border-radius:100px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);font-size:12px;color:#C8C8CE;cursor:pointer;transition:all .15s}
.chip:hover{background:rgba(77,141,255,0.12);border-color:rgba(77,141,255,0.3);color:#4D8DFF}

/* ── Input area ──────────────────────────────────────────────────── */
.input-area{padding:12px 20px 20px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(10,10,11,0.6);backdrop-filter:blur(12px);flex-shrink:0}
.input-wrap{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.input-wrap textarea{flex:1;resize:none;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:12px 16px;color:#F5F5F3;font-family:inherit;font-size:14px;line-height:1.5;outline:none;min-height:44px;max-height:160px;transition:border-color .15s}
.input-wrap textarea:focus{border-color:rgba(77,141,255,0.5)}
.input-wrap textarea::placeholder{color:#5E5E66}
.send-btn{width:44px;height:44px;border-radius:12px;border:none;background:var(--accent,#4D8DFF);color:#0A0A0B;cursor:pointer;display:grid;place-items:center;transition:all .15s;flex-shrink:0}
.send-btn:hover{transform:scale(1.05)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.send-btn svg{width:20px;height:20px}

/* ── Auth overlay ────────────────────────────────────────────────── */
.auth-overlay{position:fixed;inset:0;background:#0A0A0B;display:grid;place-items:center;z-index:100}
.auth-box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:36px;width:360px;text-align:center}
.auth-box h2{font-size:20px;font-weight:700;margin-bottom:6px}
.auth-box p{color:#8A8A90;font-size:13px;margin-bottom:20px}
.auth-box input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#F5F5F3;font-size:14px;outline:none;margin-bottom:10px}
.auth-box input:focus{border-color:rgba(77,141,255,0.5)}
.auth-box button{width:100%;padding:10px;border-radius:10px;border:none;background:#4D8DFF;color:#0A0A0B;font-size:14px;font-weight:650;cursor:pointer}
.auth-box button:hover{opacity:.9}
.auth-box .error{color:#f87171;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>

<!-- Auth overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>Sign in to Chat</h2>
    <p>Use your Quantive account credentials</p>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="authPass" placeholder="Password" autocomplete="current-password">
    <div class="error" id="authError"></div>
    <button onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- Top bar -->
<div class="topbar">
  <div class="logo">
    <img src="/quantive-logo.png" alt="Q">
    <span>Quantive <em>chat</em></span>
  </div>
  <div class="spacer"></div>
  <a href="/banking">Banking</a>
  <a href="/qubo/workspace" style="margin-left:12px">Qubo</a>
</div>

<!-- Messages -->
<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <h1>What can I help with?</h1>
    <p>Ask about your balances, transactions, Qubo tax deductions, documents, or quarterly estimates.</p>
    <div class="chips">
      <div class="chip" onclick="sendQuick('What\'s my balance?')">Balance</div>
      <div class="chip" onclick="sendQuick('Show recent transactions')">Transactions</div>
      <div class="chip" onclick="sendQuick('Show my Qubo deductions')">Deductions</div>
      <div class="chip" onclick="sendQuick('Where am I spending?')">Spending</div>
      <div class="chip" onclick="sendQuick('Quarterly estimates')">Estimates</div>
      <div class="chip" onclick="sendQuick('What documents do I have?')">Documents</div>
      <div class="chip" onclick="sendQuick('Help')">Help</div>
    </div>
  </div>
</div>

<!-- Typing indicator -->
<div class="typing" id="typing">
  <div class="typing-dot"></div>
  <div class="typing-dot"></div>
  <div class="typing-dot"></div>
</div>

<!-- Input -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Message Quantive…" autofocus></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const API = window.location.origin;
const msgs = document.getElementById('messages');
const welcome = document.getElementById('welcome');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');
const authOverlay = document.getElementById('authOverlay');
let history = [];
let loggedIn = false;

// ── Auth ──────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const r = await fetch(API + '/api/auth/me', { credentials: 'include' });
    if (r.ok) { loggedIn = true; authOverlay.style.display = 'none'; return; }
  } catch {}
  authOverlay.style.display = 'grid';
}

async function doLogin() {
  const email = document.getElementById('authEmail').value;
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authError');
  err.style.display = 'none';
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password: pass }),
    });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || 'Login failed'); }
    loggedIn = true;
    authOverlay.style.display = 'none';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

document.getElementById('authPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('authEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('authPass').focus(); });

// ── Chat ──────────────────────────────────────────────────────────
function addMsg(role, content) {
  if (welcome) welcome.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + role;
  bubble.innerHTML = renderMd(content);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderMd(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code style="background:rgba(255,255,255,0.08);padding:1px 5px;border-radius:4px;font-family:JetBrains Mono,monospace;font-size:12px">$1</code>')
    .replace(/\n/g, '<br>');
}

async function send() {
  const msg = input.value.trim();
  if (!msg || !loggedIn) return;
  input.value = '';
  autoResize();
  sendBtn.disabled = true;
  addMsg('user', msg);
  history.push({ role: 'user', content: msg });

  typing.classList.add('show');
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ message: msg, history }),
    });
    if (!r.ok) throw new Error('Request failed');
    const data = await r.json();
    addMsg('assistant', data.content);
    history.push({ role: 'assistant', content: data.content });
  } catch (e) {
    addMsg('assistant', 'Something went wrong. Please try again.');
  } finally {
    typing.classList.remove('show');
  }
}

function sendQuick(text) {
  input.value = text;
  send();
}

// ── Auto-resize textarea ──────────────────────────────────────────
function autoResize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  sendBtn.disabled = !input.value.trim();
}

input.addEventListener('input', autoResize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── Init ──────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
