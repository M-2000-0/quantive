{% extends "base.html" %}
{% block title %}Register — Quantive{% endblock %}
{% block sidebar %}{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 52px);position:relative">
  <div style="position:absolute;top:20%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(200,169,81,0.04) 0%,transparent 70%);pointer-events:none"></div>
  <div class="animate-in" style="width:100%;max-width:380px;position:relative">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:40px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--accent);color:#0a0a0b;display:grid;place-items:center;font-size:14px;font-weight:800;box-shadow:0 0 16px rgba(200,169,81,0.2)">Q</div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em">Quantive</span>
    </div>
    <div class="glass" style="padding:28px">
      <h1 style="font-size:18px;font-weight:600;margin-bottom:4px;letter-spacing:-0.02em">Request access</h1>
      <p style="font-size:12px;color:var(--text3);margin-bottom:24px">Join your team's sovereign finance platform</p>
      {% if error %}
      <div style="margin-bottom:16px;padding:12px;border-radius:8px;font-size:12px;background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.15)">{{ error }}</div>
      {% endif %}
      <form method="post" action="/register">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label class="label">First Name</label>
            <input type="text" name="first_name" class="input" placeholder="Jane" required>
          </div>
          <div>
            <label class="label">Last Name</label>
            <input type="text" name="last_name" class="input" placeholder="Doe" required>
          </div>
        </div>
        <div style="margin-top:12px">
          <label class="label">Email</label>
          <input type="email" name="email" class="input" placeholder="you@treasury.gov" required autocomplete="email">
        </div>
        <div style="margin-top:12px">
          <label class="label">Password</label>
          <input type="password" name="password" class="input" placeholder="••••••••" required minlength="8">
        </div>
        <div style="margin-top:12px">
          <label class="label">Organization</label>
          <input type="text" name="organization" class="input" placeholder="Ministry of Finance" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:10px;margin-top:20px">Request Access</button>
      </form>
    </div>
    <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--text3)">
      <a href="/login" style="color:var(--accent);font-weight:500">Sign in</a>
      <span style="margin:0 8px">·</span>
      <a href="/forgot-password" style="color:var(--text2)">Forgot password?</a>
    </div>
  </div>
</div>
{% endblock %}
