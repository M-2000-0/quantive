{% extends "base.html" %}
{% block title %}Getting Started — Quantive{% endblock %}
{% block content %}
<style>
  .ow-container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
  .ow-progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
  .ow-dot { width: 12px; height: 12px; border-radius: 50%; background: #374151; transition: all 0.3s; }
  .ow-dot.active { background: #2563eb; transform: scale(1.3); }
  .ow-dot.done { background: #34d399; }
  .ow-card { background: #1a1f2e; border: 1px solid #2d3548; border-radius: 16px; padding: 40px; text-align: center; min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ow-icon { font-size: 3rem; margin-bottom: 16px; }
  .ow-title { font-size: 1.5rem; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; }
  .ow-desc { color: #9ca3af; font-size: 0.9rem; margin-bottom: 24px; max-width: 500px; line-height: 1.6; }
  .ow-btn { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 12px 32px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
  .ow-btn:hover { background: #1d4ed8; transform: translateY(-1px); }
  .ow-btn.secondary { background: #374151; }
  .ow-btn.secondary:hover { background: #4b5563; }
  .ow-skip { color: #6b7280; font-size: 0.8rem; cursor: pointer; margin-top: 12px; text-decoration: underline; }
  .ow-checklist { text-align: left; width: 100%; max-width: 500px; }
  .ow-check { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
  .ow-check:hover { background: #1f2937; }
  .ow-check .icon { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #374151; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; transition: all 0.2s; flex-shrink: 0; }
  .ow-check.done .icon { background: #064e3b; border-color: #34d399; color: #34d399; }
  .ow-check .text { color: #e2e8f0; font-size: 0.85rem; }
  .ow-check .hint { color: #6b7280; font-size: 0.75rem; }
</style>

<div class="ow-container">
  <div class="ow-progress" id="progress"></div>
  <div class="ow-card" id="card"></div>
</div>

<script>
const steps = [
  {
    icon: '<svg width="48" height="48" fill="none" stroke="#60a5fa" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>',
    title: 'Welcome to Quantive',
    desc: 'Quantive is a sovereign debt intelligence platform that helps government finance professionals optimize debt portfolios, analyze risk, and make data-driven decisions. Let\'s walk you through the key features.',
    action: 'Get Started',
    actionNext: true,
  },
  {
    icon: '<svg width="48" height="48" fill="none" stroke="#34d399" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>',
    title: 'Start with Your Portfolio',
    desc: 'Upload your debt instruments via CSV or create them manually. The platform supports bonds, treasury bills, floating rate notes, and more across any currency.',
    action: 'Create Portfolio',
    url: '/portfolios/new',
    actionSecondary: 'Upload CSV',
    urlSecondary: '/data-import',
  },
  {
    icon: '<svg width="48" height="48" fill="none" stroke="#fbbf24" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5"/></svg>',
    title: 'Run Your First Optimization',
    desc: 'Once your portfolio is loaded, run the quantum-assisted optimizer to find the optimal debt structure. Compare classical vs quantum solutions and see potential savings.',
    action: 'Open Optimizer',
    url: '/debt-optimizer',
    actionSecondary: 'View Dashboard',
    urlSecondary: '/dashboard',
  },
  {
    icon: '<svg width="48" height="48" fill="none" stroke="#f87171" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>',
    title: 'Check Compliance',
    desc: 'Validate your portfolio against fiscal rules — debt-to-GDP limits, floating rate exposure, currency concentration, and maturity requirements. Get instant compliance scores.',
    action: 'Run Compliance Check',
    url: '/compliance-check',
    actionSecondary: 'View Fiscal Rules',
    urlSecondary: '/fiscal-rules',
  },
  {
    icon: '<svg width="48" height="48" fill="none" stroke="#a78bfa" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0112 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 01-.673-.38m0 0A2.18 2.18 0 013 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 013.413-.387m7.5 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>',
    title: 'Explore AI Briefings',
    desc: 'Generate plain-language policy recommendations powered by AI. Get insights on refinancing opportunities, risk warnings, and strategic advice — all grounded in real data.',
    action: 'View AI Advisor',
    url: '/copilot',
    actionSecondary: 'See Case Studies',
    urlSecondary: '/case-studies',
  },
  {
    icon: '<svg width="48" height="48" fill="none" stroke="#34d399" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    title: 'You\'re All Set',
    desc: 'You now know the key features. Start by creating your first portfolio or exploring the dashboard. You can always return to this guide from the settings page.',
    action: 'Go to Dashboard',
    url: '/dashboard',
    actionSecondary: 'Back to Settings',
    urlSecondary: '/user-settings',
  },
];

let currentStep = 0;

function renderProgress() {
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  steps.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'ow-dot' + (i === currentStep ? ' active' : i < currentStep ? ' done' : '');
    prog.appendChild(dot);
  });
}

function renderStep() {
  const step = steps[currentStep];
  const card = document.getElementById('card');
  
  let actions = `<button class="ow-btn" onclick="${step.url ? `window.location.href='${step.url}'` : 'nextStep()'}">${step.action}</button>`;
  if (step.urlSecondary) {
    actions += `<button class="ow-btn secondary" style="margin-left:8px;" onclick="window.location.href='${step.urlSecondary}'">${step.actionSecondary}</button>`;
  }
  
  card.innerHTML = `
    <div class="ow-icon">${step.icon}</div>
    <div class="ow-title">${step.title}</div>
    <div class="ow-desc">${step.desc}</div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      ${actions}
    </div>
    ${currentStep < steps.length - 1 ? '<div class="ow-skip" onclick="skipToDash()">Skip tour</div>' : ''}
  `;
  
  renderProgress();
}

function nextStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderStep();
  }
}

function skipToDash() {
  window.location.href = '/dashboard';
}

document.addEventListener('DOMContentLoaded', renderStep);
</script>
{% endblock %}
