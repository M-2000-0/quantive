{% extends "base.html" %}
{% block title %}Reset Password - Quantive{% endblock %}
{% block sidebar %}{% endblock %}
{% block page_title %}Reset Password{% endblock %}
{% block content %}
<div style="max-width:400px;margin:80px auto;">
  <div class="card" style="padding:32px;">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="width:48px;height:48px;border-radius:12px;background:var(--accent);color:#0a0a0b;display:grid;place-items:center;font-size:20px;font-weight:800;margin:0 auto 12px;">Q</div>
      <h2 style="font-size:18px;font-weight:700;">Set new password</h2>
      <p style="color:var(--text2);font-size:13px;margin-top:4px;">Choose a strong password for your account.</p>
    </div>
    <form>
      <div style="margin-bottom:16px;">
        <label class="label">New Password</label>
        <input type="password" class="input" placeholder="Enter new password">
      </div>
      <div style="margin-bottom:16px;">
        <label class="label">Confirm Password</label>
        <input type="password" class="input" placeholder="Confirm new password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Reset Password</button>
    </form>
    <div style="text-align:center;margin-top:16px;">
      <a href="/login" style="font-size:13px;color:var(--text2);">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
