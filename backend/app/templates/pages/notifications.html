{% extends "base.html" %}
{% block title %}Notifications — Quantive{% endblock %}
{% block page_title %}Notifications{% endblock %}

{% block content %}
<style>
  .notif-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; display: flex; gap: 12px; align-items: start; }
  .notif-card:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); }
  .notif-card.unread { border-left: 3px solid; }
  .notif-card.unread.severity-critical { border-left-color: #ef4444; }
  .notif-card.unread.severity-warning { border-left-color: #eab308; }
  .notif-card.unread.severity-info { border-left-color: #3b82f6; }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .notif-dot.critical { background: #ef4444; }
  .notif-dot.warning { background: #eab308; }
  .notif-dot.info { background: #3b82f6; }
  .notif-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); cursor: pointer; font-size: 0.78rem; font-weight: 600; }
  .filter-btn.active { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.15); }
  .empty-state { text-align: center; padding: 48px 20px; color: rgba(255,255,255,0.3); }
  .action-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
  .action-btn:hover { background: rgba(255,255,255,0.06); }
  .action-btn.primary { background: rgba(34,197,94,0.15); color: #22c55e; border-color: rgba(34,197,94,0.3); }
</style>

<!-- Header -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <div>
    <div style="font-size:1.2rem;font-weight:800;color:#fff">Notifications</div>
    <div style="font-size:0.8rem;color:rgba(255,255,255,0.4)" id="notif-summary">Loading alerts...</div>
  </div>
  <div style="display:flex;gap:8px">
    <button onclick="checkAlerts()" class="action-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Check Now
    </button>
    <button onclick="markAllRead()" class="action-btn">Mark All Read</button>
  </div>
</div>

<!-- Filters -->
<div class="notif-filters">
  <button class="filter-btn active" onclick="filterNotifs('all', this)">All</button>
  <button class="filter-btn" onclick="filterNotifs('unread', this)">Unread</button>
  <button class="filter-btn" onclick="filterNotifs('critical', this)">Critical</button>
  <button class="filter-btn" onclick="filterNotifs('drift', this)">Drift</button>
  <button class="filter-btn" onclick="filterNotifs('maturity_wall', this)">Maturity</button>
  <button class="filter-btn" onclick="filterNotifs('rate_window', this)">Rates</button>
</div>

<!-- Alert List -->
<div id="notif-list"></div>

<!-- Empty State -->
<div id="empty-state" class="empty-state" style="display:none">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.3"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  <div style="font-size:0.9rem;font-weight:600;margin-bottom:4px">No notifications</div>
  <div style="font-size:0.8rem">All portfolio conditions are within normal thresholds.</div>
</div>

<script>
const API = '/api/alerts';
let allNotifs = [];
let currentFilter = 'all';

async function loadNotifs() {
  try {
    const resp = await fetch(API + '/?limit=100', { credentials: 'include' });
    const data = await resp.json();
    allNotifs = data.alerts || [];
    renderNotifs();
  } catch(e) {
    console.error('Failed to load notifications:', e);
  }
}

function filterNotifs(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderNotifs();
}

function renderNotifs() {
  let filtered = allNotifs;
  if (currentFilter === 'unread') filtered = allNotifs.filter(n => !n.is_read);
  else if (currentFilter === 'critical') filtered = allNotifs.filter(n => n.severity === 'critical');
  else if (currentFilter !== 'all') filtered = allNotifs.filter(n => n.alert_type === currentFilter);

  const list = document.getElementById('notif-list');
  const empty = document.getElementById('empty-state');
  const unreadCount = allNotifs.filter(n => !n.is_read).length;

  document.getElementById('notif-summary').textContent =
    allNotifs.length + ' total · ' + unreadCount + ' unread';

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  list.innerHTML = filtered.map(n => {
    const timeAgo = getTimeAgo(n.created_at);
    const typeLabel = n.alert_type.replace(/_/g, ' ');
    const sevColor = n.severity === 'critical' ? '#ef4444' : n.severity === 'warning' ? '#eab308' : '#3b82f6';

    return '<div class="notif-card ' + (!n.is_read ? 'unread severity-' + n.severity : '') + '" onclick="handleNotifClick(' + n.id + ', \'' + (n.action_url || '') + '\', ' + n.is_read + ')">' +
      '<div class="notif-dot ' + n.severity + '"></div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;justify-content:space-between;align-items:start;gap:8px">' +
          '<div style="font-size:0.85rem;font-weight:600;color:#fff">' + escHtml(n.title) + '</div>' +
          '<div style="font-size:0.65rem;color:rgba(255,255,255,0.3);white-space:nowrap">' + timeAgo + '</div>' +
        '</div>' +
        '<div style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-top:4px;line-height:1.4">' + escHtml(n.message) + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">' +
          '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.65rem;font-weight:600;background:' + sevColor + '15;color:' + sevColor + ';text-transform:uppercase">' + n.severity + '</span>' +
          '<span style="font-size:0.65rem;color:rgba(255,255,255,0.3)">' + typeLabel + '</span>' +
          (n.metric_value !== null && n.metric_value !== undefined ? '<span style="font-size:0.65rem;color:rgba(255,255,255,0.3)">Value: ' + n.metric_value + '</span>' : '') +
          (n.action_url ? '<a href="' + n.action_url + '" onclick="event.stopPropagation()" class="action-btn primary">View</a>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function handleNotifClick(id, url, isRead) {
  if (!isRead) {
    try {
      await fetch(API + '/' + id + '/read', { method: 'PUT', credentials: 'include' });
      const notif = allNotifs.find(n => n.id === id);
      if (notif) notif.is_read = true;
      renderNotifs();
    } catch(e) {}
  }
  if (url) window.location.href = url;
}

async function markAllRead() {
  try {
    await fetch(API + '/read-all', { method: 'PUT', credentials: 'include' });
    allNotifs.forEach(n => n.is_read = true);
    renderNotifs();
  } catch(e) {}
}

async function checkAlerts() {
  try {
    const resp = await fetch(API + '/check', { method: 'POST', credentials: 'include' });
    const data = await resp.json();
    if (data.new_count > 0) {
      loadNotifs();
    }
  } catch(e) {}
}

function getTimeAgo(isoString) {
  if (!isoString) return '';
  const diff = Date.now() - new Date(isoString).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  const days = Math.floor(hours / 24);
  return days + 'd ago';
}

function escHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadNotifs();
setInterval(loadNotifs, 30000);
</script>
{% endblock %}
