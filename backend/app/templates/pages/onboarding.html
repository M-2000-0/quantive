{% extends "base.html" %}
{% block title %}Onboarding - Quantive{% endblock %}
{% block sidebar %}{% endblock %}
{% block page_title %}Onboarding{% endblock %}
{% block content %}
<div style="max-width:560px;margin:40px auto;">
  <div style="text-align:center;margin-bottom:32px;">
    <div style="width:48px;height:48px;border-radius:12px;background:var(--accent);color:#0a0a0b;display:grid;place-items:center;font-size:20px;font-weight:800;margin:0 auto 12px;">Q</div>
    <h2 style="font-size:20px;font-weight:700;">Welcome to Quantive</h2>
    <p style="font-size:13px;color:var(--text2);margin-top:4px;">Let's get your account set up in a few steps.</p>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;margin-bottom:32px;">
    <div style="width:40px;height:4px;border-radius:10px;background:var(--accent);"></div>
    <div style="width:40px;height:4px;border-radius:10px;background:var(--surface-2);"></div>
    <div style="width:40px;height:4px;border-radius:10px;background:var(--surface-2);"></div>
  </div>
  <div class="card" style="padding:28px;">
    <div class="section-title">Step 1: Organization Details</div>
    <form style="display:flex;flex-direction:column;gap:16px;margin-top:12px;">
      <div><label class="label">Organization Name</label><input type="text" class="input" placeholder="e.g. Ministry of Finance"></div>
      <div class="grid grid-2">
        <div><label class="label">Country</label><select class="input"><option>Select country...</option><option>United States</option><option>United Kingdom</option><option>Germany</option><option>Japan</option></select></div>
        <div><label class="label">Currency</label><select class="input"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option></select></div>
      </div>
      <div><label class="label">Portfolio Count (approximate)</label><input type="number" class="input" placeholder="e.g. 5"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
        <button type="submit" class="btn btn-primary">Continue</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
