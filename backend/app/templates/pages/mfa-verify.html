{% extends "base.html" %}
{% block title %}Verify Identity — Quantive{% endblock %}
{% block sidebar %}{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 52px)">
  <div class="animate-in" style="width:100%;max-width:380px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:40px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--accent);color:#0a0a0b;display:grid;place-items:center;font-size:14px;font-weight:800">Q</div>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em">Quantive</span>
    </div>
    <div class="glass" style="padding:28px">
      <div style="text-align:center;margin-bottom:24px">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" style="margin-bottom:8px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <h1 style="font-size:18px;font-weight:600;margin-bottom:4px">Two-Factor Authentication</h1>
        <p style="font-size:12px;color:var(--text3)">Enter the 6-digit code from your authenticator app</p>
      </div>
      {% if error %}
      <div style="margin-bottom:16px;padding:12px;border-radius:8px;font-size:12px;background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.15)">{{ error }}</div>
      {% endif %}
      <form method="post" action="/mfa/verify">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <div style="margin-bottom:16px">
          <label class="label">Verification Code</label>
          <input type="text" name="code" class="input" placeholder="000000" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px;font-weight:700">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:10px">Verify</button>
      </form>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center">
        <a href="/login" style="font-size:12px;color:var(--text2)">Back to sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
