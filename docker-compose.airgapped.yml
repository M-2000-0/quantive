# Quantive Air-Gapped Deployment
# For sovereign DMOs with no internet access
# All images must be pre-loaded via USB or data diode
#
# Usage:
#   1. On internet-connected machine: make docker-save
#   2. Copy quantive-images.tar to air-gapped network via USB
#   3. On air-gapped machine: docker load -i quantive-images.tar
#   4. docker compose -f docker-compose.airgapped.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: quantive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantive
      POSTGRES_USER: quantive
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantive -d quantive"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantive-internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: quantive-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantive-internal
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantive-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://quantive:${DB_PASSWORD}@postgres:5432/quantive
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: production
      AIR_GAPPED_MODE: "true"
      FRED_API_KEY: ""
      ENABLE_MARKET_DATA: "false"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
      - ./deployment/data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quantive-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://backend:8000
    container_name: quantive-frontend
    restart: unless-stopped
    networks:
      - quantive-internal
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    container_name: quantive-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./deployment/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - quantive-internal
    security_opt:
      - no-new-privileges:true

networks:
  quantive-internal:
    driver: bridge
    internal: false  # Nginx needs external access for HTTPS

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  backend-logs:
  nginx-logs:
