[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantive"
version = "0.1.0"
description = "Quantive — Optimization Engine / Quantitative Core for public debt optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Quantive Quantitative Engineering" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pulp>=2.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
include = ["quantive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"